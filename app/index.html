<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dMAT Prep App</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-brand">
        <div class="header-title-row">
          <h1>dMAT Prep</h1>
          <button type="button" id="themeBtn" class="theme-toggle" aria-label="Switch theme" title="Toggle theme">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="4" fill="currentColor"/>
              <path fill="currentColor" d="M12 1.5a1 1 0 0 1 1 1V4a1 1 0 1 1-2 0V2.5a1 1 0 0 1 1-1zm0 16a1 1 0 0 1 1 1v1.5a1 1 0 1 1-2 0V18.5a1 1 0 0 1 1-1zM4.22 4.22a1 1 0 0 1 1.42 0L6.7 5.3A1 1 0 1 1 5.3 6.7L4.22 5.64a1 1 0 0 1 0-1.42zm12.66 12.66a1 1 0 0 1 1.42 0l1.06 1.06a1 1 0 1 1-1.42 1.42L16.88 18.3a1 1 0 0 1 0-1.42zM1.5 12a1 1 0 0 1 1-1H4a1 1 0 1 1 0 2H2.5a1 1 0 0 1-1-1zm16 0a1 1 0 0 1 1-1H20a1 1 0 1 1 0 2h-1.5a1 1 0 0 1-1-1zM4.22 19.78a1 1 0 0 1 0-1.42L5.3 17.3A1 1 0 1 1 6.7 18.7l-1.06 1.08a1 1 0 0 1-1.42 0zm12.66-12.66a1 1 0 0 1 0-1.42L17.94 4.64a1 1 0 1 1 1.42 1.42L18.3 7.12a1 1 0 0 1-1.42 0z"/>
            </svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M20.2 14.1A8.5 8.5 0 0 1 9.9 3.8a7 7 0 1 0 10.3 10.3z"/>
            </svg>
          </button>
        </div>
        <p class="sub">Practice + Exam Mock. Original items — not past papers.</p>
      </div>
    </header>

    <section id="hubView">
      <div class="grid-2">
        <div class="panel">
          <label for="typeSelect">Question type</label>
          <select id="typeSelect">
            <option value="me">Mathematical Equations</option>
            <option value="ls">Latin Squares</option>
            <option value="fs">Figure Sequences</option>
            <option value="gam">General Academic Module</option>
            <option value="mixed">Mixed</option>
          </select>

          <label for="diffSelect">Difficulty</label>
          <select id="diffSelect">
            <option value="all">All</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>

          <label for="modeSelect">Mode</label>
          <select id="modeSelect">
            <option value="quick">Quick practice (10 items, check as you go)</option>
            <option value="exam">Exam-style set (no instant check)</option>
            <option value="timed">Timed mock (25 min / 20 items; GAM 90 min)</option>
          </select>

          <div class="controls">
            <button class="primary" id="startBtn" type="button">Start practice</button>
            <button id="examMockBtn" type="button">Start Exam Mock</button>
            <button id="learnBtn" type="button">Learn codes</button>
            <button id="aboutBtn" type="button">About dMAT</button>
            <button id="reviewBtn" type="button">Review flagged / wrong</button>
            <button class="danger" id="resetBtn" type="button">Reset progress</button>
          </div>
        </div>

        <div class="panel">
          <h2 style="margin-top:0;font-size:1.1rem">Progress</h2>
          <div class="stats" id="stats"></div>
          <h3 class="panel-sub">By type</h3>
          <div id="typeStats" class="type-stats"></div>
          <h3 class="panel-sub">Last sessions</h3>
          <div id="sessionList" class="session-list note">No sessions yet.</div>
        </div>
      </div>
    </section>

    <section id="learnView" class="hidden"></section>
    <section id="aboutView" class="hidden"></section>

    <section id="quizView" class="panel hidden">
      <div class="quiz-top">
        <div id="qMeta"></div>
        <div class="timer" id="timer">Untimed</div>
      </div>
      <div class="quiz-layout">
        <div class="quiz-main">
          <div id="stem"></div>
          <p class="prompt" id="prompt"></p>
          <div id="widgetMount"></div>
          <div class="options" id="options"></div>
          <div id="feedback" class="feedback hidden"></div>
        </div>
        <aside class="scratch-wrap" id="scratchWrap">
          <h3>Scratch pad <span class="note scratch-note">(practice only)</span></h3>
          <textarea id="scratchPad" placeholder="A=3  B=6  row2 missing C…"></textarea>
          <button type="button" id="scratchClear">Clear pad</button>
        </aside>
        <div class="nav-row">
          <button id="flagBtn" type="button">Flag</button>
          <button id="checkBtn" type="button">Check</button>
          <button id="revealBtn" type="button" class="hidden">Reveal</button>
          <button id="quitBtn" type="button">End</button>
          <button class="primary" id="nextBtn" type="button">Next</button>
        </div>
      </div>
    </section>

    <section id="resultView" class="panel hidden">
      <h2 style="margin-top:0">Session result</h2>
      <div id="resultBody"></div>
      <div class="controls" style="margin-top:1rem">
        <button class="primary" id="backHub" type="button">Back to hub</button>
      </div>
    </section>

    <section id="examRoot" class="hidden"></section>

    <footer>
      Practice is original. Exam Mock approximates digital flow — watch official videos at d-mat.de before test day.
    </footer>
  </div>
  <script type="module" src="./js/quiz.js"></script>
</body>
</html>
